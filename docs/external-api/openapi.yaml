openapi: 3.0.3
info:
  title: Semporna Jetty — External Partner API
  description: >
    Read-only reference-data endpoints exposed to external partner systems —
    currently the Semporna Jetty Resort Manifest Form, which populates its
    "Destination", "Activity", "Nationality", "Boat No." (with cascading
    "Boatman Name" / "Assistant Boatman Name"), and "Instructor" /
    "Divemaster" / "Guide" dropdowns from this API. All endpoints are
    authenticated with a static bearer token and are unrelated to this
    app's own mobile-app API (which uses Laravel Sanctum session tokens
    instead).
  version: 1.0.0
servers:
  - url: http://localhost:8000/api/external
    description: Local development (matches APP_URL in .env)

security:
  - bearerAuth: []

paths:
  /guests:
    get:
      summary: List guests
      operationId: listGuests
      tags:
        - Reference Data
      description: >
        Returns active guests, ordered by ID unless `sort` says otherwise. Only this list is paginated.
        When filter[last_synced_at] (or its last_synced_at alias) is supplied, updated_at must be strictly greater
        than that timestamp plus 15 minutes; exactly 15 minutes is excluded.
        Omit it for an initial full sync. Keep the same timestamp on every page.
        ISO 8601 timestamps with an explicit timezone are recommended;
        timestamps without a timezone use the application's timezone.
      parameters:
        - in: query
          name: sort
          description: 'Ordering; prefix a field with - for descending. Defaults to id ascending.'
          schema:
            type: string
            enum: [id, '-id', name, '-name', age, '-age']
            default: id
        - $ref: '#/components/parameters/FilterId'
        - in: query
          name: filter[name]
          description: 'Case-insensitive partial match on the guest name.'
          schema:
            type: string
        - in: query
          name: filter[ic_no]
          description: 'Exact match on the IC / passport number.'
          schema:
            type: string
        - in: query
          name: filter[nationality_name]
          description: 'Case-insensitive partial match on the nationality name.'
          schema:
            type: string
        - in: query
          name: filter[gender]
          description: 'Exact match: `F` or `M`.'
          schema:
            type: string
        - in: query
          name: filter[last_synced_at]
          description: Preferred Spatie filter; takes precedence over the top-level alias.
          schema:
            type: string
            format: date-time
        - in: query
          name: last_synced_at
          schema:
            type: string
            format: date-time
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 1000
      responses:
        '400':
          $ref: '#/components/responses/BadQuery'
        '200':
          description: Paginated guest list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        ic_no:
                          type: string
                          nullable: true
                        nationality_name:
                          type: string
                          nullable: true
                        age:
                          type: integer
                        gender:
                          type: string
                          enum: [F, M]
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                      last_page:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Invalid timestamp, page, or limit
  /destinations:
    get:
      parameters:
        - in: query
          name: sort
          description: 'Ordering; prefix a field with - for descending. Defaults to title ascending.'
          schema:
            type: string
            enum: [id, '-id', code, '-code', title, '-title']
            default: title
        - $ref: '#/components/parameters/FilterId'
        - $ref: '#/components/parameters/FilterCode'
        - $ref: '#/components/parameters/FilterTitle'
      summary: List destinations
      description: >
        Returns every active destination a guest can travel to, for
        populating a "Destination" dropdown. Server-side pre-filtered to
        actual tour/dive destinations only — departure/jetty points, which
        live in the same underlying table, are never returned here. No pagination — the whole (optionally filtered) list is returned in one response. Filter with
        `filter[title]` for a typeahead, or omit filters for a static <select>.
      operationId: listDestinations
      tags:
        - Reference Data
      responses:
        '400':
          $ref: '#/components/responses/BadQuery'
        '200':
          description: Destinations retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                success: true
                message: List Destinations
                data:
                  - id: 1
                    code: DEST_00001
                    title: Mataking
                  - id: 2
                    code: DEST_00002
                    title: Bohey Dulang
                  - id: 3
                    code: DEST_00003
                    title: Gusungan
                  - id: 4
                    code: DEST_00004
                    title: Sibuan
                  - id: 5
                    code: DEST_00005
                    title: Pom-Pom
        '401':
          $ref: '#/components/responses/Unauthorized'

  /activities:
    get:
      parameters:
        - in: query
          name: sort
          description: 'Ordering; prefix a field with - for descending. Defaults to title ascending.'
          schema:
            type: string
            enum: [id, '-id', code, '-code', title, '-title']
            default: title
        - $ref: '#/components/parameters/FilterId'
        - $ref: '#/components/parameters/FilterCode'
        - $ref: '#/components/parameters/FilterTitle'
      summary: List activities
      description: >
        Returns every active activity a guest can take part in, for
        populating an "Activity" dropdown. No pagination — the whole (optionally filtered) list is returned in one response.
      operationId: listActivities
      tags:
        - Reference Data
      responses:
        '400':
          $ref: '#/components/responses/BadQuery'
        '200':
          description: Activities retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                success: true
                message: List Activities
                data:
                  - id: 1
                    code: ACT_00001
                    title: Snorkeling
                  - id: 2
                    code: ACT_00002
                    title: Fun Dive/Diving
                  - id: 3
                    code: ACT_00003
                    title: Free Diving
                  - id: 4
                    code: ACT_00004
                    title: Accommodation
                  - id: 5
                    code: ACT_00005
                    title: IDC
        '401':
          $ref: '#/components/responses/Unauthorized'

  /nationalities:
    get:
      parameters:
        - in: query
          name: sort
          description: 'Ordering; prefix a field with - for descending. Defaults to title ascending.'
          schema:
            type: string
            enum: [id, '-id', code, '-code', title, '-title']
            default: title
        - $ref: '#/components/parameters/FilterId'
        - $ref: '#/components/parameters/FilterCode'
        - $ref: '#/components/parameters/FilterTitle'
      summary: List nationalities
      description: >
        Returns every active nationality, for populating a "Nationality"
        dropdown. No pagination — the whole (optionally filtered) list is returned in one response.
      operationId: listNationalities
      tags:
        - Reference Data
      responses:
        '400':
          $ref: '#/components/responses/BadQuery'
        '200':
          description: Nationalities retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                success: true
                message: List Nationalities
                data:
                  - id: 1
                    code: NAT_00001
                    title: Malaysian
                  - id: 2
                    code: NAT_00002
                    title: Singaporean
                  - id: 3
                    code: NAT_00003
                    title: Indonesian
                  - id: 4
                    code: NAT_00004
                    title: British
                  - id: 5
                    code: NAT_00005
                    title: Australian
        '401':
          $ref: '#/components/responses/Unauthorized'

  /boats:
    get:
      parameters:
        - in: query
          name: sort
          description: 'Ordering; prefix a field with - for descending. Defaults to number ascending.'
          schema:
            type: string
            enum: [id, '-id', number, '-number']
            default: number
        - $ref: '#/components/parameters/FilterId'
        - in: query
          name: filter[company_id]
          description: 'Exact match on the owning company. Comma-separated for several.'
          schema:
            type: string
        - in: query
          name: filter[number]
          description: 'Case-insensitive partial match on the boat number, e.g. `P11` matches `SA/P11/0513`.'
          schema:
            type: string
      summary: List boats
      description: >
        Returns every boat across all partner companies, each with its
        boat-assigned crew nested inline, for populating a "Boat No."
        dropdown whose "Boatman Name" / "Assistant Boatman Name" dropdowns
        cascade from the selected boat. `boatman` here only ever contains
        type 1 (Boatman) and 2 (Assistant) — those are the only types ever
        assigned to a boat; Instructor/Divemaster/Guide (types 3-5) are
        company-wide crew not tied to any boat, so they never appear here —
        see `GET /boatmen` for those. Not scoped by company/resort — the
        static bearer token isn't per-partner today, so every company's
        boats are returned. No pagination — the whole (optionally filtered) list is returned in one response.
      operationId: listBoats
      tags:
        - Reference Data
      responses:
        '400':
          $ref: '#/components/responses/BadQuery'
        '200':
          description: Boats retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: List Boats
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Boat'
                required: [success, message, data]
              example:
                success: true
                message: List Boats
                data:
                  - id: 1
                    name: Sea Explorer
                    number: SA/P11/0513
                    license: LIC-00512
                    license_expiry_date: '2026-08-01'
                    capacity: 12
                    company:
                      id: 3
                      name: Coral Breeze Resort Semporna
                    boatman:
                      - id: 10
                        boat_id: 1
                        name: Ahmad bin Yusof
                        ic_no: '901231-12-1234'
                        mate_card: MC-1029
                        seaman_card_no: SC-5521
                        type: 1
                        type_label: Boatman
                      - id: 11
                        boat_id: 1
                        name: Rahim bin Osman
                        ic_no: '920501-12-5678'
                        mate_card: null
                        seaman_card_no: SC-5522
                        type: 2
                        type_label: Assistant
                  - id: 2
                    name: Ocean Breeze
                    number: SA/P12/0510
                    license: LIC-00498
                    license_expiry_date: '2026-02-15'
                    capacity: 10
                    company:
                      id: 3
                      name: Coral Breeze Resort Semporna
                    boatman: []
        '401':
          $ref: '#/components/responses/Unauthorized'

  /boatmen:
    get:
      parameters:
        - in: query
          name: sort
          description: 'Ordering; prefix a field with - for descending. Defaults to name ascending.'
          schema:
            type: string
            enum: [id, '-id', name, '-name', type, '-type']
            default: name
        - $ref: '#/components/parameters/FilterId'
        - in: query
          name: filter[type]
          description: 'Crew type, exact. Comma-separated for several: `filter[type]=3,4,5` returns Instructors, Divemasters and Guides. 1=Boatman, 2=Assistant, 3=Instructor, 4=Divemaster, 5=Guide.'
          schema:
            type: string
        - in: query
          name: filter[boat_id]
          description: 'Exact match on the assigned boat. Comma-separated for several.'
          schema:
            type: string
        - in: query
          name: filter[company_id]
          description: 'Exact match on the company. Comma-separated for several.'
          schema:
            type: string
        - in: query
          name: filter[name]
          description: 'Case-insensitive partial match on the name.'
          schema:
            type: string
        - in: query
          name: filter[ic_no]
          description: 'Exact match on the IC number.'
          schema:
            type: string
      summary: List boatmen (all types, all companies)
      description: >
        Returns every crew record — all 5 types, across all partner
        companies — as a flat list, each carrying its own `company`. Use
        this for the Manifest Form's "Instructor Details" / "Divemaster
        Details" / "Guide Details" sections (types 3/4/5), which have no
        "Boat No." field because that crew isn't assigned to any specific
        boat (`boat_id: null`) — filter this list client-side by `type` to
        populate each dropdown. Types 1 (Boatman) and 2 (Assistant) are also
        included here (with their `boat_id` set) for completeness, but the
        Boat No. → Boatman/Assistant cascade should use the nested
        `boatman[]` already returned by `GET /boats` rather than
        cross-referencing this list. No pagination — the whole (optionally filtered) list is returned in one response.
      operationId: listBoatmen
      tags:
        - Reference Data
      responses:
        '400':
          $ref: '#/components/responses/BadQuery'
        '200':
          description: Boatmen retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: List Boatmen
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Boatman'
                required: [success, message, data]
              example:
                success: true
                message: List Boatmen
                data:
                  - id: 10
                    boat_id: 1
                    name: Ahmad bin Yusof
                    ic_no: '901231-12-1234'
                    mate_card: MC-1029
                    seaman_card_no: SC-5521
                    type: 1
                    type_label: Boatman
                    company:
                      id: 3
                      name: Coral Breeze Resort Semporna
                  - id: 20
                    boat_id: null
                    name: Faizal Instructor
                    ic_no: '880101-12-1111'
                    mate_card: null
                    seaman_card_no: null
                    type: 3
                    type_label: Instructor
                    company:
                      id: 3
                      name: Coral Breeze Resort Semporna
                  - id: 21
                    boat_id: null
                    name: Diana Divemaster
                    ic_no: '890202-12-2222'
                    mate_card: null
                    seaman_card_no: null
                    type: 4
                    type_label: Divemaster
                    company:
                      id: 3
                      name: Coral Breeze Resort Semporna
                  - id: 22
                    boat_id: null
                    name: Guntur Guide
                    ic_no: '900303-12-3333'
                    mate_card: null
                    seaman_card_no: null
                    type: 5
                    type_label: Guide
                    company:
                      id: 3
                      name: Coral Breeze Resort Semporna
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  parameters:
    FilterId:
      in: query
      name: filter[id]
      description: Exact match. Comma-separated for several, e.g. `filter[id]=1,2,3`.
      schema:
        type: string
        example: '1,2'
    FilterCode:
      in: query
      name: filter[code]
      description: Exact match. Comma-separated for several, e.g. `filter[code]=DEST_00001,DEST_00002`.
      schema:
        type: string
    FilterTitle:
      in: query
      name: filter[title]
      description: Case-insensitive partial match (`mat` matches "Mataking").
      schema:
        type: string

  responses:
    BadQuery:
      description: >
        Unsupported `filter[...]` or `sort` value. `message` names the offending
        value and lists the allowed ones.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: 'Requested filter(s) `bogus` are not allowed. Allowed filter(s) are `id, code, title`.'
            data: null
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Unauthorized.
            data: null

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Static partner token issued out-of-band. Sent as
        `Authorization: Bearer <token>`, compared with hash_equals()
        against the EXTERNAL_API_TOKEN configured in this app's environment.


        For local development, this repo's `.env.example` ships with a
        working default token so the API is usable immediately after
        `cp .env.example .env`:


        ```

        Authorization: Bearer c2871b190dd64a01e916702b286964a10fb5481644855e1ef81cf140ac0c8080

        ```


        This value is a placeholder for local dev only — generate a new
        token (e.g. `openssl rand -hex 32`) for staging/production and
        keep it out of version control.

  schemas:
    RefItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        code:
          type: string
          example: DEST_00001
        title:
          type: string
          example: Mataking
      required: [id, code, title]

    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: List Destinations
        data:
          type: array
          items:
            $ref: '#/components/schemas/RefItem'
      required: [success, message, data]

    Boatman:
      type: object
      properties:
        id:
          type: integer
          example: 10
        boat_id:
          type: integer
          nullable: true
          description: >
            The boat this crew member is assigned to. Always set for type 1
            (Boatman) and 2 (Assistant) — always null for type 3
            (Instructor), 4 (Divemaster), 5 (Guide), which are company-wide
            crew not tied to any specific boat.
          example: 1
        name:
          type: string
          example: Ahmad bin Yusof
        ic_no:
          type: string
          nullable: true
          example: '901231-12-1234'
        mate_card:
          type: string
          nullable: true
          example: MC-1029
        seaman_card_no:
          type: string
          nullable: true
          example: SC-5521
        type:
          type: integer
          description: '1=Boatman, 2=Assistant, 3=Instructor, 4=Divemaster, 5=Guide'
          example: 1
        type_label:
          type: string
          nullable: true
          example: Boatman
        company:
          type: object
          nullable: true
          description: >
            Only present on `GET /boatmen` (the flat endpoint). Omitted when
            a Boatman is nested inside a `/boats` entry, since the parent
            boat's own `company` already gives this.
          properties:
            id:
              type: integer
              example: 3
            name:
              type: string
              example: Coral Breeze Resort Semporna
          required: [id, name]
      required: [id, boat_id, name, ic_no, mate_card, seaman_card_no, type, type_label]

    Boat:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Sea Explorer
        number:
          type: string
          nullable: true
          example: SA/P11/0513
        license:
          type: string
          nullable: true
          example: LIC-00512
        license_expiry_date:
          type: string
          format: date
          nullable: true
          example: '2026-08-01'
        capacity:
          type: integer
          nullable: true
          example: 12
        company:
          type: object
          nullable: true
          description: The owning company; `null` if that company has since been deleted.
          properties:
            id:
              type: integer
              example: 3
            name:
              type: string
              example: Coral Breeze Resort Semporna
          required: [id, name]
        boatman:
          type: array
          items:
            $ref: '#/components/schemas/Boatman'
      required: [id, name, number, license, license_expiry_date, capacity, company, boatman]

    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Unauthorized.
        data:
          type: object
          nullable: true
          example: null
      required: [success, message, data]
