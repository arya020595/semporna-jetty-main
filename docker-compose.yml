services:
  app:
    build:
      args:
        user: crims
        uid: 1000
      context: ./
      dockerfile: Dockerfile
    image: crims
    container_name: crims-app
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - ./:/var/www
    networks:
      - crims

  nginx:
    image: nginx:alpine
    container_name: crims-nginx
    restart: unless-stopped
    ports:
      - 8000:80
    volumes:
      - ./:/var/www
      - ./docker-compose/nginx:/etc/nginx/conf.d/
    networks:
      - crims

  mysql:
    image: mysql:8.0
    container_name: crims-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: survey
    ports:
      - "3307:3306"
    volumes:
      - crims-mysql-data:/var/lib/mysql
    networks:
      - crims

networks:
  crims:

volumes:
  crims-mysql-data:
