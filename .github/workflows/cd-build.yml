name: CD - Build & Push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # composer.json requires easycode/autopull from a private GitLab repo over
      # SSH, which CI has no access to. Same workaround as ci.yml — drops it from
      # this ephemeral checkout only (which is also the Docker build context
      # below), never committed back to the repo.
      - name: Drop private auto-deploy dependency (unreachable from CI)
        run: |
          composer remove easycode/autopull --no-update
          php -r '
            $lock = json_decode(file_get_contents("composer.lock"), true);
            $lock["packages"] = array_values(array_filter(
                $lock["packages"],
                fn ($p) => $p["name"] !== "easycode/autopull"
            ));
            file_put_contents(
                "composer.lock",
                json_encode($lock, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE) . "\n"
            );
          '

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/arya020595/semporna-jetty
          tags: |
            type=raw,value=latest
            type=sha,prefix=main-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"cd-build failed for ${{ github.sha }} on main — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|logs>\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
