openapi: 3.0.3
info:
  title: Semporna Jetty — External Partner API
  description: >
    Read-only reference-data endpoints exposed to external partner systems —
    currently the Semporna Jetty Resort Manifest Form, which populates its
    "Destination", "Activity", and "Nationality" dropdowns from this API. All
    endpoints are authenticated with a static bearer token and are unrelated
    to this app's own mobile-app API (which uses Laravel Sanctum session
    tokens instead).
  version: 1.0.0
servers:
  - url: http://localhost:8000/api/external
    description: Local development (matches APP_URL in .env)

security:
  - bearerAuth: []

paths:
  /destinations:
    get:
      summary: List destinations
      description: >
        Returns every active destination a guest can travel to, for
        populating a "Destination" dropdown. Server-side pre-filtered to
        actual tour/dive destinations only — departure/jetty points, which
        live in the same underlying table, are never returned here. No
        pagination and no query parameters: the full active list is always
        returned, since this backs a static <select>, not a typeahead.
      operationId: listDestinations
      tags:
        - Reference Data
      responses:
        '200':
          description: Destinations retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                success: true
                message: List Destinations
                data:
                  - id: 1
                    code: DEST_00001
                    title: Mataking
                  - id: 2
                    code: DEST_00002
                    title: Bohey Dulang
                  - id: 3
                    code: DEST_00003
                    title: Gusungan
                  - id: 4
                    code: DEST_00004
                    title: Sibuan
                  - id: 5
                    code: DEST_00005
                    title: Pom-Pom
        '401':
          $ref: '#/components/responses/Unauthorized'

  /activities:
    get:
      summary: List activities
      description: >
        Returns every active activity a guest can take part in, for
        populating an "Activity" dropdown. No pagination and no query
        parameters — the full active list is always returned.
      operationId: listActivities
      tags:
        - Reference Data
      responses:
        '200':
          description: Activities retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                success: true
                message: List Activities
                data:
                  - id: 1
                    code: ACT_00001
                    title: Snorkeling
                  - id: 2
                    code: ACT_00002
                    title: Fun Dive/Diving
                  - id: 3
                    code: ACT_00003
                    title: Free Diving
                  - id: 4
                    code: ACT_00004
                    title: Accommodation
                  - id: 5
                    code: ACT_00005
                    title: IDC
        '401':
          $ref: '#/components/responses/Unauthorized'

  /nationalities:
    get:
      summary: List nationalities
      description: >
        Returns every active nationality, for populating a "Nationality"
        dropdown. No pagination and no query parameters — the full active
        list is always returned.
      operationId: listNationalities
      tags:
        - Reference Data
      responses:
        '200':
          description: Nationalities retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                success: true
                message: List Nationalities
                data:
                  - id: 1
                    code: NAT_00001
                    title: Malaysian
                  - id: 2
                    code: NAT_00002
                    title: Singaporean
                  - id: 3
                    code: NAT_00003
                    title: Indonesian
                  - id: 4
                    code: NAT_00004
                    title: British
                  - id: 5
                    code: NAT_00005
                    title: Australian
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Static partner token issued out-of-band. Sent as
        `Authorization: Bearer <token>`, compared with hash_equals()
        against the EXTERNAL_API_TOKEN configured in this app's environment.


        For local development, this repo's `.env.example` ships with a
        working default token so the API is usable immediately after
        `cp .env.example .env`:


        ```

        Authorization: Bearer c2871b190dd64a01e916702b286964a10fb5481644855e1ef81cf140ac0c8080

        ```


        This value is a placeholder for local dev only — generate a new
        token (e.g. `openssl rand -hex 32`) for staging/production and
        keep it out of version control.

  schemas:
    RefItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        code:
          type: string
          example: DEST_00001
        title:
          type: string
          example: Mataking
      required: [id, code, title]

    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: List Destinations
        data:
          type: array
          items:
            $ref: '#/components/schemas/RefItem'
      required: [success, message, data]

    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Unauthorized.
        data:
          type: object
          nullable: true
          example: null
      required: [success, message, data]

  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Unauthorized.
            data: null
